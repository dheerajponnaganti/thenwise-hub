name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The browser tests run against a real server from a pinned thenwise release (0.1.17 or later has the chat screens).
      - uses: actions/checkout@v4
        with: { repository: dheerajponnaganti/thenwise, ref: v0.1.23, path: .e2e/thenwise }
      - run: npx playwright install --with-deps chromium && npm run e2e
        env: { THENWISE_SRC: .e2e/thenwise }
